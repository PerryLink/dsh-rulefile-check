<text x="64" y="297" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13" font-weight="700">runTableCheck</text>
<text x="182" y="297" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="12">· 7 rules, one check each</text>
<text x="1036" y="297" fill="#7f8ba6" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11" text-anchor="end">pure · no I/O · no model</text>
<text x="64" y="326" fill="#7f8ba6" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5" letter-spacing="1.1">RULE</text>
<text x="160" y="326" fill="#7f8ba6" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5" letter-spacing="1.1">FIELD CHECKED</text>
<text x="404" y="326" fill="#7f8ba6" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5" letter-spacing="1.1">CHECK KIND</text>
<text x="596" y="326" fill="#7f8ba6" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5" letter-spacing="1.1">WHEN IT FIRES</text>
<text x="984" y="326" fill="#7f8ba6" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5" letter-spacing="1.1">CAP</text>
<line x1="64" y1="366" x2="1036" y2="366" stroke="#2a3550" stroke-width="1"/>
<text x="64" y="356" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-001</text>
<text x="160" y="356" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">ruleId</text>
<text x="404" y="356" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">unique</text>
<text x="596" y="356" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="13">a duplicate id (whitespace ignored)</text>
<rect x="980" y="345" width="46" height="20" rx="10" fill="#232e47"/>
<text x="986" y="359" fill="#a9b8ff" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">warn</text>
<rect x="52" y="368" width="996" height="26" rx="7" fill="#1e2739"/>
<line x1="64" y1="396" x2="1036" y2="396" stroke="#2a3550" stroke-width="1"/>
<text x="64" y="386" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-002</text>
<text x="160" y="386" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">document · clause</text>
<text x="404" y="386" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">presenceAny</text>
<text x="596" y="386" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="13">both basis fields are empty</text>
<rect x="980" y="375" width="46" height="20" rx="10" fill="#232e47"/>
<text x="986" y="389" fill="#a9b8ff" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">warn</text>
<line x1="64" y1="426" x2="1036" y2="426" stroke="#2a3550" stroke-width="1"/>
<text x="64" y="416" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-003</text>
<text x="160" y="416" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">excerpt</text>
<text x="404" y="416" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">minLength ≥ 8</text>
<text x="596" y="416" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="13">shorter than 8 characters</text>
