<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d">
<title id="t">dsh-rulefile-check structure: material and rule pack → seven-rule ledger → issues and skipped</title>
<desc id="d">Two inputs (the material rule file and the validated rule pack) feed one seven-row check table; each rule checks one field and is capped at warn; the report has two outlets, issues and skipped.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.95" y2="1"><stop offset="0" stop-color="#131a2a"/><stop offset="1" stop-color="#0c1016"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.16" r="0.62"><stop offset="0" stop-color="#8496f5" stop-opacity="0.10"/><stop offset="1" stop-color="#8496f5" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>
<rect width="1100" height="660" rx="20" fill="url(#bg)"/>
<rect width="1100" height="660" rx="20" fill="url(#glow)"/>
<text x="48" y="34" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11" letter-spacing="1.6">DSH PLUGIN · RULEFILE CHECK</text>
<text x="48" y="68" fill="#eef2fb" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="26" font-weight="700">Seven rules, one rule file</text>
<text x="48" y="92" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="12">material + rule pack → runTableCheck → issues · skipped · the original is never modified</text>
<text x="1052" y="68" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="12" text-anchor="end">7 rules · 12 material columns</text>
<line x1="48" y1="104" x2="1052" y2="104" stroke="#2a3550" stroke-width="1"/>
<rect x="40" y="112" width="480" height="128" rx="16" fill="#1a2233" stroke="#2d3854" stroke-width="1" filter="url(#sh)"/>
<text x="64" y="136" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11" letter-spacing="1.2">MATERIAL · JSON / YAML</text>
<text x="64" y="162" fill="#eef2fb" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="16.5" font-weight="700">The rule file: header + one row per rule</text>
<text x="64" y="186" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5">header  packName · plugin · version · engineKinds</text>
<text x="64" y="206" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5">row     ruleId · basisKind · excerpt · source · checkKind</text>
<text x="64" y="228" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">→ parseMaterial · aliases folded · missing fields become findings</text>
<rect x="544" y="112" width="516" height="128" rx="16" fill="#1a2233" stroke="#2d3854" stroke-width="1" filter="url(#sh)"/>
<text x="568" y="136" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11" letter-spacing="1.2">RULE PACK · LOAD-TIME</text>
<text x="568" y="162" fill="#eef2fb" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="16.5" font-weight="700">rules/rulefile-check.yaml · 7 rules</text>
<text x="568" y="186" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5">cap by basis.kind: direct ≤ error · derived-from-principle ≤ warn</text>
<text x="568" y="206" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5">institutional-configuration ≤ info</text>
<text x="568" y="228" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">over the cap → loader rejects: strongest permitted severity</text>
