<text x="986" y="509" fill="#a9b8ff" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">warn</text>
<text x="64" y="536" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-007</text>
<text x="160" y="536" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">packName · plugin · version</text>
<text x="404" y="536" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">headerPresence</text>
