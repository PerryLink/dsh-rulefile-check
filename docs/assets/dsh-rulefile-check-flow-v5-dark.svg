<text x="986" y="419" fill="#a9b8ff" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">warn</text>
<rect x="52" y="428" width="996" height="26" rx="7" fill="#1e2739"/>
