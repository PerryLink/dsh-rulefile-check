<text x="64" y="446" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-004</text>
<text x="160" y="446" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">source</text>
<text x="404" y="446" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">pattern</text>
<text x="596" y="446" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="13">not an http(s) link</text>
<rect x="980" y="435" width="46" height="20" rx="10" fill="#232e47"/>
<text x="986" y="449" fill="#a9b8ff" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">warn</text>
<text x="64" y="476" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-005</text>
<text x="160" y="476" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">basisKind → severity</text>
<text x="404" y="476" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">conditionalPresence</text>
<text x="596" y="476" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="13">a derived/config basis has no severity</text>
<rect x="980" y="465" width="46" height="20" rx="10" fill="#232e47"/>
<text x="986" y="479" fill="#a9b8ff" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11">warn</text>
<rect x="52" y="486" width="996" height="30" rx="10" fill="#1e2739"/>
<text x="64" y="506" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13.5" font-weight="700">RF-006</text>
<text x="160" y="506" fill="#eef2fb" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="13">checkKind</text>
