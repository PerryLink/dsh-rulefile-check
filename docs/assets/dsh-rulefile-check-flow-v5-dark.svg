<rect x="40" y="566" width="644" height="80" rx="16" fill="#1a2233" stroke="#2d3854" stroke-width="1" filter="url(#sh)"/>
<text x="64" y="590" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="12.5" font-weight="700">↳ REPORT · issues[]</text>
<text x="224" y="590" fill="#9aa7c2" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="12">one entry per difference</text>
<text x="64" y="613" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5">ruleId · severity · locator{row, field} · found / expected / fix · basis</text>
<text x="64" y="633" fill="#7f8ba6" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5">lists differences only — no compliance, liability or correctness verdict</text>
<rect x="708" y="566" width="352" height="80" rx="16" fill="#1a2233" stroke="#2d3854" stroke-width="1" filter="url(#sh)"/>
<text x="732" y="590" fill="#8496f5" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="12.5" font-weight="700">↳ skipped[] · did not run</text>
<text x="732" y="613" fill="#9aa7c2" font-family="Consolas,'Cascadia Mono','SFMono-Regular',ui-monospace,'Microsoft YaHei',monospace" font-size="11.5">rule · reason — RF-006 ships values empty</text>
<text x="732" y="633" fill="#8496f5" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif" font-size="11.5">an empty list is never 'nothing is wrong'</text>
</svg>
